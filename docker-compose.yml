services:

  # ─── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-venkern}
      POSTGRES_USER: ${POSTGRES_USER:-venkern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-venkern123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-venkern} -d ${POSTGRES_DB:-venkern}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # ─── Flask API ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FLASK_APP: run.py
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-venkern}:${POSTGRES_PASSWORD:-venkern123}@db:5432/${POSTGRES_DB:-venkern}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      UPLOAD_FOLDER: uploads
      SEED_DB: ${SEED_DB:-false}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - app-network

  # ─── React + Nginx ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
